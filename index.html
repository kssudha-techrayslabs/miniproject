<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <form id="registrationForm" class="bg-white p-6 rounded-lg shadow-lg w-96">
        <h2 class="text-xl font-bold mb-4">Register</h2>
        
        <label class="block mb-2">Full Name</label>
        <input type="text" id="fullName" class="w-full p-2 border rounded" placeholder="John Doe">
        <p class="text-red-500 text-sm hidden" id="nameError">Only alphabets and spaces allowed.</p>

        <label class="block mt-4 mb-2">Email Address</label>
        <input type="text" id="email" class="w-full p-2 border rounded" placeholder="user@example.com">
        <p class="text-red-500 text-sm hidden" id="emailError">Invalid email format.</p>

        <label class="block mt-4 mb-2">Mobile Number</label>
        <input type="text" id="mobile" class="w-full p-2 border rounded" placeholder="+911234567890">
        <p class="text-red-500 text-sm hidden" id="mobileError">Invalid Indian mobile number format.</p>

        <label class="block mt-4 mb-2">Password</label>
        <input type="password" id="password" class="w-full p-2 border rounded">
        <p class="text-red-500 text-sm hidden" id="passwordError">Password must be at least 6 characters.</p>

        <label class="block mt-4 mb-2">Confirm Password</label>
        <input type="password" id="confirmPassword" class="w-full p-2 border rounded">
        <p class="text-red-500 text-sm hidden" id="confirmPasswordError">Passwords do not match.</p>

        <div class="mt-4">
            <input type="checkbox" id="terms">
            <label for="terms">I agree to the terms and conditions</label>
        </div>
        <p class="text-red-500 text-sm hidden" id="termsError">You must agree to the terms.</p>

        <button type="submit" class="mt-4 w-full bg-blue-500 text-white p-2 rounded">Register</button>
    </form>

   <script src="script.js"></script>
</body>
</html>
