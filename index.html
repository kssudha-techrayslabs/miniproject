<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</head>
<body class="text-center mx-5" style="font-family: Arial,sans-serif;">
    <div class="mx-auto p-3  border rounded" style="max-width: 400px;box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.2);background-color: #1d5c9c;">
        <h2 class="mb-4">Weather App</h2>
        <div class="mb-3">
            <input type="text" id="city" class="form-control" placeholder="Enter city name">
        </div>
        <button id="getWeather" class="btn btn-primary w-100">Get Weather</button>
        <div id="weatherInfo" class="mt-4"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
